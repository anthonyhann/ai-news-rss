name: Collect AI Signals

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Optional source id or kind, e.g. x-ai-builders"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ainews-state
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore state branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/restore-state.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            browser-worker/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir browser-worker install --frozen-lockfile
      - name: Install yt-dlp for YouTube transcripts
        continue-on-error: true
        run: |
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          chmod +x /usr/local/bin/yt-dlp
      - name: Build Rust binary
        run: cargo build --release
      - name: Collect and score
        env:
          ONLY_SOURCE: ${{ inputs.only }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_SCORING_MODEL: ${{ secrets.LLM_SCORING_MODEL }}
          LLM_EDITOR_MODEL: ${{ secrets.LLM_EDITOR_MODEL }}
          X_LIST_URL: ${{ secrets.X_LIST_URL }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          TWITTER_PROXY: ${{ secrets.TWITTER_PROXY }}
          WECHAT_RSS_BASE: ${{ secrets.WECHAT_RSS_BASE }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RUST_LOG: ainews=info
        run: |
          if [ -n "$ONLY_SOURCE" ]; then
            ./target/release/ainews run --no-brief --only "$ONLY_SOURCE"
          else
            ./target/release/ainews run --no-brief
          fi
      - name: Build static dashboard
        run: pnpm --dir web build
      - name: Save state branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/save-state.sh
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
